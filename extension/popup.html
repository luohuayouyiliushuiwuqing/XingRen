<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>收进Almond看板</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="brand">Almond看板</span>
    <span id="status" class="status"></span>
  </header>

  <section class="actions">
    <button id="saveCurrent" class="primary">收藏当前页</button>
    <div id="currentHint" class="hint" hidden></div>
    <button id="saveAll">收藏当前窗口标签（<span id="tabCount">0</span>）</button>
  </section>

  <details id="settings">
    <summary>看板地址</summary>
    <div class="row">
      <input id="boardUrl" spellcheck="false" placeholder="http://127.0.0.1:4000">
      <button id="saveUrl">保存</button>
    </div>
    <div class="hint">默认本机 4000；保存时去掉尾部 <code>/</code>，仅接受 http(s) 地址。</div>
  </details>

  <!-- CSP 是 script-src 'self'：内联 script 会被静默拦掉（装得上、点了没反应），必须外链 -->
  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
