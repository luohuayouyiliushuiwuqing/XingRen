<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>元数据看板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <button id="sidebarToggle" class="btn-icon" title="收起/展开侧边栏">☰</button>
    <div class="brand"><span class="brand-dot"></span>元数据看板</div>
    <input id="urlInput" class="input grow" placeholder="粘贴 URL 后回车添加…" spellcheck="false">
    <button id="addBtn" class="btn-primary">添加</button>
    <button id="importBtn" class="btn-ghost">导入</button>
    <input id="fileInput" type="file" accept=".txt,.html,.htm" hidden>
    <input id="searchInput" class="input search" placeholder="搜索标题或链接…">
    <input id="proxyInput" class="input proxy" placeholder="代理，如 http://127.0.0.1:7892">
  </header>

  <main>
    <aside id="sidebar" class="sidebar"></aside>
    <div class="board-wrap">
      <div id="board" class="board"></div>
      <div id="emptyHint" class="empty-hint" hidden>还没有书签，粘贴一个 URL 开始吧</div>
    </div>
  </main>

  <footer class="statusbar"><span id="statusText">加载中…</span></footer>

  <!-- 重命名弹窗 -->
  <div id="modalMask" class="modal-mask" hidden>
    <div class="modal">
      <div class="modal-title">重命名</div>
      <input id="modalInput" class="input" spellcheck="false">
      <div class="modal-actions">
        <button id="modalCancel" class="btn-ghost">取消</button>
        <button id="modalOk" class="btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 标签弹窗 -->
  <div id="tagMask" class="modal-mask" hidden>
    <div class="modal">
      <div class="modal-title">管理标签</div>
      <div id="tagList" class="tag-list"></div>
      <div class="tag-add-row">
        <input id="tagInput" class="input" placeholder="新建标签名…" spellcheck="false">
        <button id="tagAddBtn" class="btn-ghost">添加</button>
      </div>
      <div class="modal-actions">
        <button id="tagClose" class="btn-primary">关闭</button>
      </div>
    </div>
  </div>

  <!-- 域名管理弹窗 -->
  <div id="domainMask" class="modal-mask" hidden>
    <div class="modal">
      <div class="modal-title" id="domainTitle">域名管理</div>
      <div class="domain-form">
        <label>显示别名</label>
        <input id="domainNameInput" class="input" placeholder="如：深度求索" spellcheck="false">
        <label>域名代理（留空用全局代理）</label>
        <input id="domainProxyInput" class="input" placeholder="如：http://127.0.0.1:7892" spellcheck="false">
      </div>
      <div class="modal-actions">
        <button id="domainCancel" class="btn-ghost">取消</button>
        <button id="domainSave" class="btn-primary">保存</button>
      </div>
    </div>
  </div>

  <!-- 详情弹层 -->
  <div id="detailMask" class="modal-mask" hidden>
    <div class="modal detail-modal">
      <div class="modal-title" id="detailTitle">详情</div>
      <div class="detail-domain" id="detailDomain"></div>
      <div class="detail-fields" id="detailFields"></div>
      <div class="modal-actions">
        <button id="detailRefresh" class="btn-ghost">重新抓取</button>
        <button id="detailClose" class="btn-primary">关闭</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
